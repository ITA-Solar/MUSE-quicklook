[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "muse-pyfiles"
version = "1.0.0"
description = "MUSE PyFiles - File Selection and Management Tool for MUSE data"
requires-python = ">=3.8"
license = {text = "See LICENSE file in IRIS-Software-UIO directory"}
authors = [
    {name = "MUSE Team", email = "your-email@example.com"},
]
keywords = ["astronomy", "MUSE", "data-analysis", "FITS"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "PyQt6>=6.4.0",
    "astropy>=5.0",
    "numpy>=1.20.0",
    "python-dateutil>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-qt>=4.0",
    "black>=22.0",
    "ruff>=0.0.250",
]

[project.scripts]
muse-pyfiles = "muse_pyfiles:main"

[project.urls]
Homepage = "https://github.com/your-org/MUSE-quicklook"
Documentation = "https://github.com/your-org/MUSE-quicklook/blob/main/README_MUSE_PyFiles.md"

[tool.setuptools]
py-modules = ["muse_pyfiles", "muse_recent_timewindows"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

[tool.pytest.ini_options]
testpaths = ["test_muse_pyfiles.py"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
